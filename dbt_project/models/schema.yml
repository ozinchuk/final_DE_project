version: 2

models:
  - name: stg_orders
    description: "Orders data"
    columns:
      - name: order_id
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null
      - name: order_status
        data_tests:
          - accepted_values:
              values: ['delivered', 'created', 'canceled', 'invoiced', 'shipped', 'processing', 'approved', 'unavailable']

  - name: stg_customers
    description: "Customers data"
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: customer_unique_id
        data_tests:
          - not_null

  - name: stg_products
    description: "Products description"
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: stg_reviews
    description: "Reviews data"
    columns:
      - name: review_id
        data_tests:
          - not_null
      - name: review_score
        data_tests:
          - accepted_values:
              values: ['1', '2', '3', '4', '5']

  - name: stg_sellers
    description: "Sellers data"
    columns:
      - name: seller_id
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_patients')
              field: patient_id

  - name: stg_items
    description: "Items data"
    columns:
      - name: order_id
        data_tests:
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: product_id
        data_tests:
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: seller_id
        data_tests:
          - relationships:
              to: ref('stg_sellers')
              field: seller_id
